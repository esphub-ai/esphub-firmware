name: ESP-Mosaico native example
description: Build Espressif's Hello World with the EspHub SDK.
runs:
  using: composite
  steps:
    - name: Read the upstream revision
      id: upstream
      shell: bash
      run: |
        python3 - "$BOARD_DIR/native/upstream.json" <<'PYTHON' >> "$GITHUB_OUTPUT"
        import json
        import sys

        with open(sys.argv[1]) as file:
            source = json.load(file)
        for component, revision in source.items():
            print(f"{component}_repository={revision['repository']}")
            print(f"{component}_ref={revision['ref']}")
        PYTHON
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.upstream.outputs.bsp_repository }}
        ref: ${{ steps.upstream.outputs.bsp_ref }}
        path: mosaico-bsp
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.upstream.outputs.utils_repository }}
        ref: ${{ steps.upstream.outputs.utils_ref }}
        path: mosaico-utils
    - name: Build Espressif's Hello World
      shell: bash
      run: |
        set -eo pipefail
        source "$IDF_PATH/export.sh"
        export MOSAICO_BSP="$GITHUB_WORKSPACE/mosaico-bsp"
        export MOSAICO_UTILS="$GITHUB_WORKSPACE/mosaico-utils"
        project="$BOARD_DIR/native/project"
        idf.py -C "$project" -DPROJECT_VER="$VERSION" app
        image="$project/build/mosaico_hello.bin"
        esptool --chip esp32s31 image-info "$image"
        test "$(stat -c %s "$image")" -le 4194304
        mkdir -p dist
        asset="esphub-$BOARD_FILE_STEM-native-$VERSION"
        cp "$image" "dist/$asset.bin"
        (cd dist && sha256sum "$asset.bin" > "$asset.sha256")
