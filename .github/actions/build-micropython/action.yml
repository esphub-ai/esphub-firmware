name: Build EspHub MicroPython
description: Apply the board overlay and compile the MicroPython image.
runs:
  using: composite
  steps:
    - name: Select the source revision and board port
      id: upstream
      shell: bash
      run: |
        target=$(jq -er .target "$BOARD_DIR/micropython/profile.json")
        port=m5stack
        if [[ "$target" == ESP32_GENERIC* ]]; then port=micropython/ports/esp32; fi
        echo "MP_PORT=$port" >> "$GITHUB_ENV"
        echo "MP_TARGET=$target" >> "$GITHUB_ENV"
        jq -er '"repository=" + .repository, "ref=" + .ref' firmware/pyrt/upstream.json >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.upstream.outputs.repository }}
        ref: ${{ steps.upstream.outputs.ref }}
        path: uiflow
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: "3.11"
    - name: System packages
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends quilt gperf || {
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends quilt gperf
        }
    - name: Cache ESP-IDF v5.5.5
      id: idf-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.espressif
          uiflow/esp-idf
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-idf-v5.5.5-py${{ steps.python.outputs.python-version }}
    - name: ESP-IDF v5.5.5
      if: steps.idf-cache.outputs.cache-hit != 'true'
      working-directory: uiflow
      shell: bash
      run: |
        source tools/ci.sh
        ci_esp32_idf555_setup
    - name: UIFlow submodules and patches
      working-directory: uiflow
      shell: bash
      run: |
        source esp-idf/export.sh
        if [[ "$MP_PORT" == m5stack ]]; then
          git submodule update --init --jobs 8 -- micropython esp-adf m5stack ':!m5stack/components/lv_bindings'
          git -C m5stack/cmodules/lv_binding_micropython submodule update --init --recursive --jobs 8
          git -C esp-adf submodule update --init --jobs 2 -- components/esp-adf-libs components/esp-sr
          pip install future
        else
          git submodule update --init -- micropython
        fi
        git -C micropython submodule update --init --jobs 3 -- lib/berkeley-db-1.xx lib/tinyusb lib/micropython-lib
        if [[ "$MP_PORT" == m5stack ]]; then
          make -C m5stack patch
        else
          for component in micropython esp-idf; do
            make -C m5stack "$component" unprepare
            make -C m5stack "$component" prepare
          done
        fi
    - name: Apply the esp-bootloader overlay
      shell: bash
      run: |
        python3 firmware/pyrt/apply_overlay.py uiflow firmware "$BOARD" "$VERSION"
    - name: Build
      working-directory: uiflow
      shell: bash
      run: |
        source esp-idf/export.sh
        if [[ "$MP_PORT" == m5stack ]]; then
          make -C m5stack BOARD="$MP_TARGET" build
        else
          make -C micropython/mpy-cross -j2
          make -C "$MP_PORT" BOARD="$MP_TARGET" BOARD_DIR="boards/$MP_TARGET" USER_C_MODULES="$PWD/$MP_PORT/cmodules/okou/micropython.cmake" \
            FROZEN_MANIFEST="$PWD/$MP_PORT/okl/manifest.py"
        fi
    - name: Verify and package the board runtime
      shell: bash
      run: |
        image="uiflow/${MP_PORT}/build-${MP_TARGET}/micropython.bin"
        python3 - "$image" "$BOARD" <<'PYTHON'
        import sys
        profile = f"ESPHUB2/micropython/{sys.argv[2]}\0bootloader-ota-v2\0".encode()
        with open(sys.argv[1], "rb") as image:
            image.seek(288)
            assert image.read(len(profile)) == profile
        PYTHON
        test "$(stat -c %s "$image")" -le 4194304
        grep -Fx "CONFIG_PM_ENABLE=y" "uiflow/${MP_PORT}/build-${MP_TARGET}/sdkconfig"
        grep -Fx "CONFIG_OKOU_BLE_WIFI=y" "uiflow/${MP_PORT}/build-${MP_TARGET}/sdkconfig"
        grep -Fx "CONFIG_FREERTOS_USE_TICKLESS_IDLE=y" "uiflow/${MP_PORT}/build-${MP_TARGET}/sdkconfig"
        grep -Fx "CONFIG_OKOU_BOARD_PROFILE=\"$BOARD\"" "uiflow/${MP_PORT}/build-${MP_TARGET}/sdkconfig"
        mkdir -p dist
        cp "$image" "dist/esphub-$BOARD_FILE_STEM-micropython-$VERSION.bin"
        cd dist && sha256sum *.bin > "esphub-$BOARD_FILE_STEM-micropython-$VERSION.sha256"
