name: Build a bootloader set and the boards that use it
on:
  workflow_call:
    inputs:
      cohort: {type: string, required: true}
permissions: {contents: read}
jobs:
  bootloader:
    if: fromJSON(inputs.cohort).bootloader != null
    permissions: {contents: read, actions: write}
    uses: ./.github/workflows/build-bootloader.yml
    with:
      build_group: ${{ fromJSON(inputs.cohort).bootloader.buildGroup }}
      container: ${{ fromJSON(inputs.cohort).bootloader.container }}
      variant: ${{ fromJSON(inputs.cohort).bootloader.variant }}
      fingerprint: ${{ fromJSON(inputs.cohort).bootloader.fingerprint }}
      version: ${{ fromJSON(inputs.cohort).bootloader.version }}
  # Board apps do not depend on the bootloader set; each publishes independently.
  board:
    if: fromJSON(inputs.cohort).name != 'examples' && toJSON(fromJSON(inputs.cohort).boards) != '[]'
    name: ${{ matrix.profile.board }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.cohort).boards }}
    concurrency:
      group: firmware-${{ github.ref }}-${{ matrix.profile.board }}
      queue: max
    permissions: {contents: read, actions: write}
    uses: ./.github/workflows/build-board.yml
    with:
      profile: ${{ toJSON(matrix.profile) }}
  examples:
    if: fromJSON(inputs.cohort).name == 'examples'
    name: ${{ matrix.profile.board }} / ${{ join(matrix.profile.examples, ', ') }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.cohort).boards }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.profile.components[0].container }}
    concurrency:
      group: ${{ matrix.profile.components[0].buildGroup }}
      queue: max
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build changed examples
        shell: bash
        env:
          BOARD: ${{ matrix.profile.board }}
          EXAMPLES: ${{ join(matrix.profile.examples, ' ') }}
          VERSION: ${{ matrix.profile.components[0].version }}
        run: |
          set -eo pipefail
          source "$IDF_PATH/export.sh"
          read -ra examples <<< "$EXAMPLES"
          for example in "${examples[@]}"; do
            python3 scripts/build-example.py "$BOARD" --example "$example" --version "$VERSION"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile.fileStem }}.app
          path: dist/
          if-no-files-found: error
