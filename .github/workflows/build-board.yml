name: Build a board app
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
permissions: {contents: read}
env:
  BOARD: ${{ fromJSON(inputs.profile).board }}
  BOARD_FILE_STEM: ${{ fromJSON(inputs.profile).fileStem }}
jobs:
  app:
    concurrency:
      group: ${{ fromJSON(inputs.profile).components[0].buildGroup }}
      queue: max
    runs-on: ubuntu-24.04
    container: ${{ toJSON(fromJSON(inputs.profile).appShard) == 'null' && fromJSON(inputs.profile).components[0].container || null }}
    env:
      VERSION: ${{ fromJSON(inputs.profile).components[0].version }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        if: toJSON(fromJSON(inputs.profile).appShard) != 'null'
        with:
          name: app-shard-${{ fromJSON(inputs.profile).appShard }}
          path: shard-apps
      - name: Copy the board application from the compiled shard
        if: toJSON(fromJSON(inputs.profile).appShard) != 'null'
        shell: bash
        run: mv "shard-apps/$BOARD_FILE_STEM" dist
      - name: Build the default app and all published source examples
        if: toJSON(fromJSON(inputs.profile).appShard) == 'null'
        shell: bash
        run: |
          set -eo pipefail
          source "$IDF_PATH/export.sh"
          python3 scripts/build-example.py "$BOARD" --all --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOARD_FILE_STEM }}.app
          path: dist/
          if-no-files-found: error
  queue-publish:
    concurrency:
      group: ${{ fromJSON(inputs.profile).components[0].buildGroup }}
      queue: max
    needs: app
    if: >-
      ${{ vars.FIRMWARE_PUBLISH_ENABLED == 'true' &&
          github.repository == 'esphub-ai/esphub-firmware' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions: {actions: write}
    steps:
      - name: Dispatch this board for publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-board.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run="$GITHUB_RUN_ID" -f board="$BOARD"
