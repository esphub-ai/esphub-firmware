name: SDK version automation
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
# Each run reconciles every open PR, so replacement of a pending run cannot
# drop a PR event. Serialize main updates and PR events with the same worker.
concurrency:
  group: sdk-version-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'esphub-ai/esphub-firmware'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
    steps:
      # Never check out a PR head or execute scripts supplied by a PR. This job
      # has write permissions; its code must come from the trusted main branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Reconcile SDK versions and request PR CI
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node scripts/sdk-version-automation.mjs
