name: Board photos
on:
  pull_request:
    paths: ['static/boards/**', 'scripts/board-photos.mjs', '.github/workflows/board-photos.yml']
  push:
    branches: [main]
    paths: ['static/boards/**', 'scripts/board-photos.mjs', '.github/workflows/board-photos.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node scripts/board-photos.mjs

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.repository == 'okou-ai/esphub-firmware' && github.ref == 'refs/heads/main' && vars.FIRMWARE_PUBLISH_ENABLED == 'true'
    concurrency: { group: board-photos-production, cancel-in-progress: false }
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node scripts/board-photos.mjs --publish
        env:
          FIRMWARE_R2_ENDPOINT: ${{ vars.FIRMWARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FIRMWARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FIRMWARE_R2_SECRET_ACCESS_KEY }}
