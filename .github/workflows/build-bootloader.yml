name: Build a shared EspHub bootloader
on:
  workflow_call:
    inputs:
      build_group: {type: string, required: true}
      container: {type: string, required: true}
      variant: {type: string, required: true}
      fingerprint: {type: string, required: true}
      version: {type: string, required: true}
permissions: {contents: read}
concurrency:
  group: bl-${{ github.ref }}-${{ inputs.variant }}-${{ inputs.fingerprint }}
  queue: max
env:
  IDF_IMAGE: ${{ inputs.container }}
  VARIANT: ${{ inputs.variant }}
  VERSION: ${{ inputs.version }}
jobs:
  build:
    concurrency:
      group: ${{ inputs.build_group }}
      queue: max
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/cache@v4
        id: bootloader-cache
        with:
          path: shared-bl
          key: shared-bootloader-${{ inputs.fingerprint }}
      - name: Compile the shared binaries
        if: steps.bootloader-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e VARIANT -e VERSION -e GITHUB_SHA \
            "$IDF_IMAGE" bash scripts/build-bootloader.sh
      - name: Check launcher image size
        run: |
          size=$(stat --format=%s shared-bl/esp-bootloader.bin)
          limit=$((0x140000))  # 1.25 MiB per launcher slot
          echo "$VARIANT: $size / $limit bytes"
          if (( size > limit )); then
            echo "::error::$VARIANT exceeds the launcher limit by $((size - limit)) bytes"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bl-${{ inputs.variant }}
          path: shared-bl/
          if-no-files-found: error
