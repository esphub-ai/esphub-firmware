name: Board firmware
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'scripts/build-bootloader.sh'
      - 'scripts/package-bootloader.py'
      - 'scripts/build-example.py'
      - 'scripts/firmware-plan.mjs'
      - 'scripts/firmware-coverage.mjs'
      - 'scripts/board-catalog.mjs'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/build-board.yml'
      - '.github/workflows/build-app-shard.yml'
      - 'scripts/build-app-shard.py'
      - '.github/workflows/build-variant.yml'
      - '.github/workflows/build-bootloader.yml'
      - 'shared/*.js'
  pull_request:
    paths:
      - 'firmware/**'
      - 'scripts/build-bootloader.sh'
      - 'scripts/package-bootloader.py'
      - 'scripts/build-example.py'
      - 'scripts/firmware-plan.mjs'
      - 'tests/firmware-plan.test.js'
      - 'scripts/firmware-coverage.mjs'
      - 'scripts/board-catalog.mjs'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/build-board.yml'
      - '.github/workflows/build-app-shard.yml'
      - 'scripts/build-app-shard.py'
      - '.github/workflows/build-variant.yml'
      - '.github/workflows/build-bootloader.yml'
      - 'shared/*.js'
  workflow_dispatch:
    inputs:
      board:
        description: Board ID for a forced rebuild. Leave blank on main to catch up outstanding board builds.
        type: string
        required: false
      pr_number:
        description: Trusted SDK bot PR CI request.
        type: string
        required: false
run-name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.board && !inputs.pr_number && 'Catch up main board builds' || '' }}
permissions: {contents: read}
# PR events and SDK-bot dispatches for the same PR share a group with the
# merged-PR cleanup workflow. Automatic main batches run one at a time.
concurrency:
  group: board-firmware-${{ (github.ref == 'refs/heads/main' && !inputs.board && !inputs.pr_number && 'main') || (github.event.pull_request.number || inputs.pr_number) && format('pr-{0}', github.event.pull_request.number || inputs.pr_number) || format('run-{0}', github.run_id) }}
  queue: ${{ github.ref == 'refs/heads/main' && !inputs.board && !inputs.pr_number && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') }}
jobs:
  context:
    uses: ./.github/workflows/pr-ci-context.yml
    with: {pr_number: '${{ inputs.pr_number }}'}
  plan:
    needs: context
    runs-on: ubuntu-latest
    outputs:
      cohorts: ${{ steps.plan.outputs.cohorts }}
      app_shards: ${{ steps.plan.outputs.app_shards }}
      coverage_base: ${{ steps.plan.outputs.coverage_base }}
      expected_builds: ${{ steps.plan.outputs.expected_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate the PR board catalog and build selection
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        run: |
          node scripts/board-catalog.mjs
          node --test tests/firmware-plan.test.js
      - id: plan
        env:
          PR_CI_BASE_SHA: ${{ needs.context.outputs.base_sha }}
          FW_HEAD_SHA: ${{ needs.context.outputs.head_sha || github.sha }}
        run: node scripts/firmware-plan.mjs
  applications:
    needs: plan
    if: needs.plan.outputs.app_shards != '[]'
    name: Application shard ${{ matrix.plan.shard }}
    strategy:
      fail-fast: false
      matrix:
        plan: ${{ fromJSON(needs.plan.outputs.app_shards) }}
    uses: ./.github/workflows/build-app-shard.yml
    with:
      shard: ${{ matrix.plan.shard }}
      groups: ${{ toJSON(matrix.plan.groups) }}
  build:
    needs: [plan, applications]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.applications.result == 'success' || needs.applications.result == 'skipped') && needs.plan.outputs.cohorts != '[]' }}
    # Keep cohort and board job names stable for release evidence.
    name: ${{ matrix.cohort.name }}
    strategy:
      fail-fast: false
      matrix:
        cohort: ${{ fromJSON(needs.plan.outputs.cohorts) }}
    permissions: {contents: read, actions: write}
    uses: ./.github/workflows/build-variant.yml
    with:
      cohort: ${{ toJSON(matrix.cohort) }}
  check:
    name: Firmware
    needs: [plan, applications, build]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && !inputs.pr_number }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected firmware build to pass
        env:
          PLAN: ${{ needs.plan.result }}
          APPS: ${{ needs.applications.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$PLAN" = success
          test "$APPS" = success || test "$APPS" = skipped
          test "$BUILD" = success || test "$BUILD" = skipped

  coverage:
    name: Record main board build coverage
    needs: [plan, applications, build]
    if: >-
      ${{ always() && !cancelled() && needs.plan.result == 'success' && (needs.applications.result == 'success' || needs.applications.result == 'skipped') && needs.plan.outputs.expected_builds != '' &&
          github.repository == 'esphub-ai/esphub-firmware' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.board && !inputs.pr_number)) }}
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Record the revision after checking the selected jobs
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_BASE: ${{ needs.plan.outputs.coverage_base }}
          EXPECTED_BUILDS: ${{ needs.plan.outputs.expected_builds }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_ENABLED: ${{ vars.FIRMWARE_PUBLISH_ENABLED }}
        run: node scripts/firmware-coverage.mjs
