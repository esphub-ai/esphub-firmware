name: Board firmware
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'scripts/build-bootloader.sh'
      - 'scripts/package-*.py'
      - 'tools/ble-wifi/provision_usb.py'
      - 'scripts/build-example.py'
      - 'scripts/firmware-plan.mjs'
      - '.github/actions/build-kit/**'
      - '.github/workflows/build-board.yml'
      - '.github/workflows/build-variant.yml'
      - '.github/workflows/build-bootloader.yml'
      - 'shared/*.js'
  pull_request:
    paths:
      - 'firmware/**'
      - 'scripts/build-bootloader.sh'
      - 'scripts/package-*.py'
      - 'tools/ble-wifi/provision_usb.py'
      - 'scripts/build-example.py'
      - 'scripts/firmware-plan.mjs'
      - '.github/actions/build-kit/**'
      - '.github/workflows/build-board.yml'
      - '.github/workflows/build-variant.yml'
      - '.github/workflows/build-bootloader.yml'
      - 'shared/*.js'
  workflow_dispatch:
    inputs:
      board:
        description: Group/project board ID, e.g. m5stack/stopwatch.
        type: string
        required: false
      pr_number:
        description: Trusted SDK bot PR CI request.
        type: string
        required: false
permissions: {contents: read}
# PR events and SDK-bot dispatches for the same PR share a group with the
# merged-PR cleanup workflow. Each main push and manual board run stays independent.
concurrency:
  group: board-firmware-${{ (github.event.pull_request.number || inputs.pr_number) && format('pr-{0}', github.event.pull_request.number || inputs.pr_number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') }}
jobs:
  context:
    uses: ./.github/workflows/pr-ci-context.yml
    with: {pr_number: '${{ inputs.pr_number }}'}
  plan:
    needs: context
    runs-on: ubuntu-latest
    outputs:
      cohorts: ${{ steps.plan.outputs.cohorts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - id: plan
        env:
          PR_CI_BASE_SHA: ${{ needs.context.outputs.base_sha }}
          FW_HEAD_SHA: ${{ needs.context.outputs.head_sha || github.sha }}
        run: node scripts/firmware-plan.mjs
  build:
    needs: plan
    if: needs.plan.outputs.cohorts != '[]'
    name: ${{ matrix.cohort.name }}
    strategy:
      fail-fast: false
      matrix:
        cohort: ${{ fromJSON(needs.plan.outputs.cohorts) }}
    permissions: {contents: read, actions: write}
    uses: ./.github/workflows/build-variant.yml
    with:
      cohort: ${{ toJSON(matrix.cohort) }}
  check:
    name: Firmware
    needs: [plan, build]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && !inputs.pr_number }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected firmware build to pass
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$PLAN" = success
          test "$BUILD" = success || test "$BUILD" = skipped
